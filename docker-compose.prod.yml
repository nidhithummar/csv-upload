version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: csv_app_db_prod
    environment:
      POSTGRES_DB: ${DB_NAME:-csv_upload_db}
      POSTGRES_USER: ${DB_USER:-csv_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-csv_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - csv_network_prod
    restart: unless-stopped

  # Node.js Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: csv_app_backend_prod
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-csv_upload_db}
      DB_USER: ${DB_USER:-csv_user}
      DB_PASSWORD: ${DB_PASSWORD:-csv_password}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - csv_network_prod
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: csv_app_frontend_prod
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:5000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - csv_network_prod
    restart: unless-stopped

volumes:
  postgres_data_prod:

networks:
  csv_network_prod:
    driver: bridge
