services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: csv_app_db
    environment:
      POSTGRES_DB: csv_upload_db
      POSTGRES_USER: csv_user
      POSTGRES_PASSWORD: csv_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - csv_network

  # Node.js Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: csv_app_backend
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: csv_upload_db
      DB_USER: csv_user
      DB_PASSWORD: csv_password
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - csv_network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: csv_app_frontend
    environment:
      REACT_APP_API_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - csv_network

volumes:
  postgres_data:

networks:
  csv_network:
    driver: bridge
